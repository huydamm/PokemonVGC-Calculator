name: CI

# Pushes to main run this through deploy.yml (and tags through release-ext.yml), so no push trigger here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:ext
      - run: npm run pack:ext
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error
