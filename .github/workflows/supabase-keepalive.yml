# Free Supabase projects pause after ~7 days without database activity, which takes the
# project's DNS down. An anon read of `teams` runs a real query (RLS returns []).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail-with-body -sS "$URL/rest/v1/teams?select=id&limit=1" -H "apikey: $KEY"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
