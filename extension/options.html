<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VGC Live Calc options</title>
    <!-- Dark first paint; the full theme is adopted by dist/options.js. -->
    <style>html { background: #16130f; color: #f3ead7; }</style>
  </head>
  <body>
    <main class="opt">
      <h1>VGC Live Calc</h1>
      <p class="hint" id="status" role="status">Checking your plan…</p>
      <div class="row">
        <button id="pay" type="button">Buy / manage</button>
        <button id="login" type="button" class="quiet">Log in</button>
      </div>
      <p class="hint small">Paid already on another browser? Log in with the email you paid with.</p>
    </main>
    <script src="dist/options.js"></script>
  </body>
</html>
