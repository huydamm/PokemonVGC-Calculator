<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VGC Live Calc options</title>
    <!-- Dark first paint; the full theme is adopted by dist/options.js. -->
    <style>html { background: #16130f; color: #f3ead7; }</style>
  </head>
  <body>
    <main class="opt">
      <h1>VGC Live Calc</h1>
      <p class="hint">Your Anthropic API key is stored locally in this browser and only sent to api.anthropic.com.</p>
      <label class="field" for="key">API key</label>
      <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <div class="row">
        <button id="save" type="button">Save</button>
        <span id="status" role="status"></span>
      </div>
    </main>
    <script src="dist/options.js"></script>
  </body>
</html>
